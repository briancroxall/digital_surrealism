<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Image maker check</title></head>
<body>
<p id="status">Running…</p>
<script type="module">
// Runs the Image maker's real worker on frames served by browser_check.py,
// then posts the four images back so they can be compared with tools/reference.py.
// The only difference from the page: frames are fetched instead of chosen.
const status = (text) => { document.getElementById("status").textContent = text; };
const report = (path, body) => fetch(path, {method: "POST", body});

try {
  const names = await (await fetch("/frames/")).json();
  const files = [];
  for (const name of names) files.push(await (await fetch(`/frames/${encodeURIComponent(name)}`)).blob());
  const started = performance.now();
  // Load the page code from a fresh address each run (/fresh/<number>/web/...),
  // so a browser can't reuse an old cached copy of the worker or the files it
  // imports. Safari did, which mixed old and new code.
  const worker = new Worker(`/fresh/${Date.now()}/web/worker.js`, {type: "module"});
  worker.onerror = async (event) => {
    await report("/error", `The worker didn't start: ${event.message || "no details given"}`);
  };
  worker.onmessage = async ({data}) => {
    if (data.type === "progress") {
      status(`${data.done} of ${data.total}`);
    } else if (data.type === "error") {
      await report("/error", data.message);
    } else if (data.type === "done") {
      const seconds = (performance.now() - started) / 1000;
      for (const [kind, png] of Object.entries(data.images)) await report(`/${kind}.png`, png);
      await report("/info", JSON.stringify({seconds, count: data.count, ranges: data.ranges,
                                            labelled: data.labelled,
                                            userAgent: navigator.userAgent}));
      status("Done");
    }
  };
  worker.postMessage({files, names});
} catch (error) {
  await report("/error", String(error));
}
</script>
</body>
</html>
